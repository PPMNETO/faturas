<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gestão de Faturas</title>
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #070a0f;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #070a0f;
      color: #38bdf8;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(56, 189, 248, 0.25);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #070a0f;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <span>Carregando faturas...</span>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbze_M9ZrV-YdBF_-K8kVqY64euexeoMl_Oo02zAvP9HCM7uX_dJzxH3vQe6u1IndTK4/exec"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.opacity='0'; setTimeout(() => document.getElementById('loader').remove(), 320);">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=2').catch(() => {});
    }
  </script>
</body>
</html>
